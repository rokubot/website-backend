[project]
name = "roku-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "aiohttp-cors>=0.8.1",
    "aiohttp-session[secure]>=2.12.1",
    "gunicorn>=26.2.0",
    "asyncpg>=0.31.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.3",
    "uvloop>=0.23.0",
]

[tool.black]
line-length = 124
skip-string-normalization = true


[tool.isort]
profile = "black"
combine_as_imports = true
combine_star = true
line_length = 124
skip = ['.venv']

[tool.uv]
package=false
